<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WinNook</title>
    <!-- Lets external plugin bundles keep `react` etc. as bare imports; they resolve to the host's instances. -->
    <script type="importmap">
      {
        "imports": {
          "react": "/shims/react.js",
          "react/jsx-runtime": "/shims/react-jsx-runtime.js",
          "react/jsx-dev-runtime": "/shims/react-jsx-runtime.js",
          "@winnook/sdk": "/shims/winnook-sdk.js"
        }
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
